        const TARIFA_KWH = 0.81;
        const CUSTO_KWH_USINA = 0.175126;

        const ALLOWED_CLIENT_KEYS = ['adilson', 'joao', 'inquilino'];

        const NATIVE_MONTHS = [
            'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
            'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
        ];

        const HEADER_WORDS = ['cliente', 'clientkey', 'nome', 'usuario', 'usuário', 'user', 'cip', 'consumo', 'mês', 'mes', 'status'];

        // Paleta vibrante para os avatares circulares
        const AVATAR_COLORS = [
            'bg-blue-600 text-white shadow-[0_0_12px_rgba(37,99,235,0.5)]',
            'bg-violet-600 text-white shadow-[0_0_12px_rgba(124,58,237,0.5)]',
            'bg-teal-600 text-white shadow-[0_0_12px_rgba(13,148,136,0.5)]',
            'bg-amber-500 text-white shadow-[0_0_12px_rgba(245,158,11,0.5)]',
            'bg-emerald-600 text-white shadow-[0_0_12px_rgba(5,150,105,0.5)]',
            'bg-purple-600 text-white shadow-[0_0_12px_rgba(147,51,234,0.5)]',

            'bg-orange-500 text-white shadow-[0_0_12px_rgba(249,115,22,0.5)]'

        let globalAllInvoices = [];
        let globalAllClients = [];
        let currentFilteredCards = [];

        let loadDataError = null;

        window.onload = () => {
            startAppWithVideo();
        };

        function startAppWithVideo() {
            const video = document.getElementById('loading-video');
            
            // Inicia o carregamento dos dados da planilha em segundo plano
            const dataPromise = loadAdminData().catch(err => {
                loadDataError = err;
            });

            // Função chamada unicamente quando o vídeo terminar
            const finishIntro = async () => {
                await dataPromise; // Aguarda a planilha terminar o carregamento

                if (loadDataError) {
                    showConfigScreen(loadDataError.message || 'Erro ao ler dados da planilha.');
                } else {
                    hideLoadingScreen();
                }
            };

            if (video) {
                // Tenta dar o play
                video.play().catch(() => {});

                // SÓ FINALIZA A TELA DE ENTRADA QUANDO O VÍDEO TERMINAR TOTALMENTE
                video.onended = () => {
                    finishIntro();
                };

                // Se houver erro de carregamento no arquivo do vídeo, aguarda e abre a tela
                video.onerror = () => {
                    finishIntro();
                };
            } else {
                finishIntro();
            }
        }

        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loading-screen');
            if (!loadingScreen) return;
            
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                initClean3DScene();
            }, 600);
        }

        function getStoredSheetId() {
            return localStorage.getItem(STORAGE_KEY) || DEFAULT_SHEET_ID;
        }

        function extractSheetId(input) {
            if (!input) return '';
            const match = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : input.trim();
        }

        function saveSheetConfig() {
            const rawVal = document.getElementById('input-sheet-id').value;
            const extracted = extractSheetId(rawVal);
            if (!extracted) {
                alert('Por favor, insira um ID ou Link válido.');
                return;
            }
            localStorage.setItem(STORAGE_KEY, extracted);
            closeConfigModal();
            location.reload();
        }

        function clearSheetConfig() {
            if (confirm('Deseja restaurar para o link de planilha padrão?')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function openConfigModal() {
            document.getElementById('input-sheet-id').value = getStoredSheetId();
            const overlay = document.getElementById('config-overlay');
            const sheet = document.getElementById('config-sheet');
            overlay.style.display = 'block';
            setTimeout(() => {
                overlay.style.opacity = '1';
                sheet.style.transform = 'translate(-50%, 0)';
            }, 10);
        }

        function closeConfigModal() {
            const overlay = document.getElementById('config-overlay');
            const sheet = document.getElementById('config-sheet');
            sheet.style.transform = 'translate(-50%, 100%)';
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 350);
        }

        function parseCSV(str) {
            const arr = []; let quote = false; let row = [], col = '';
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                if (cc === '\r') continue; 
                if (cc === '"' && quote && nc === '"') { col += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { row.push(col.trim()); col = ''; continue; }
                if (cc === '\n' && !quote) {
                    if (col.trim() || row.length) { row.push(col.trim()); arr.push(row); }
                    row = []; col = ''; continue;
                }
                col += cc;
            }
            if (col || row.length) { row.push(col.trim()); arr.push(row); }
            return arr;
        }

        function safeParseFloat(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            let str = val.toString().replace(/[R$\s]/g, '');
            if (str.includes(',') && str.includes('.')) { str = str.replace(/\./g, '').replace(',', '.'); } 
            else if (str.includes(',')) { str = str.replace(',', '.'); }
            let num = parseFloat(str); return isNaN(num) ? 0 : num;
        }

        function normalizeClientKey(name) {
            if (!name) return '';
            return name.toLowerCase()
                       .normalize("NFD")
                       .replace(/[\u0300-\u036f]/g, "")
                       .trim();
        }

        function isAllowedClient(name) {
            const norm = normalizeClientKey(name);
            return ALLOWED_CLIENT_KEYS.some(key => norm.includes(key));
        }

        async function fetchGoogleSheet(sheetName) {
            const SHEET_ID = getStoredSheetId();
            if(!SHEET_ID) throw new Error('NO_SHEET_ID');

            const urls = [
                `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`,
                `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=${encodeURIComponent(sheetName)}`
            ];

            let lastError = null;
            for (const url of urls) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const text = await response.text();
                        if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                            throw new Error('PLANILHA_PRIVADA');
                        }
                        return parseCSV(text);
                    }
                } catch (e) {
                    lastError = e;
                }
            }
            throw lastError || new Error('Falha ao acessar planilha');
        }

        function showConfigScreen(msg) {
            const loadingScreen = document.getElementById('loading-screen');
            if (!loadingScreen) return;
            loadingScreen.innerHTML = `
                <div class="text-center p-6 bg-[#111933] border border-sky-400/25 rounded-3xl max-w-sm mx-auto shadow-2xl relative z-10">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-solar-neon flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                    </div>
                    <h3 class="text-white font-extrabold text-lg mb-2">Atenção ao Carregar</h3>
                    <p class="text-xs text-slate-300 mb-5 leading-relaxed font-normal">${msg}</p>
                    <div class="space-y-2">
                        <button onclick="openConfigModal()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl text-xs font-extrabold uppercase tracking-wider transition-colors">Configurar Planilha</button>
                    </div>
                </div>
            `;
        }

        async function loadAdminData() {
            let loginData = [];
            try {
                loginData = await fetchGoogleSheet('login');
            } catch (e) {
                if (e.message === 'PLANILHA_PRIVADA') {
                    throw new Error('A sua planilha precisa estar pública ("Qualquer pessoa com o link").');
                }
                throw e;
            }

            const cipMap = {};
            globalAllClients = [];

            loginData.forEach(r => {
                if(r[0] && r[0].trim()) {
                    const clientName = r[0].trim();
                    const normKey = normalizeClientKey(clientName);
                    
                    if (HEADER_WORDS.includes(normKey)) return;
                    if (!isAllowedClient(clientName)) return;

                    cipMap[normKey] = safeParseFloat(r[1]);
                    if(!globalAllClients.some(c => normalizeClientKey(c) === normKey)) {
                        globalAllClients.push(clientName);
                    }
                }
            });

            let invoicesData = [];
            const possibleSheetNames = ['Form_Responses', 'Respostas ao formulário 1', 'Respostas do formulário 1', 'Respostas'];
            
            for (const sheetName of possibleSheetNames) {
                try {
                    const res = await fetchGoogleSheet(sheetName);
                    if (res && res.length > 0) {
                        invoicesData = res;
                        break;
                    }
                } catch (e) {}
            }

            if (invoicesData.length > 0) {
                invoicesData.shift();
            }

            globalAllInvoices = [];
            const monthsArray = [];

            for(let row of invoicesData) {
                while(row.length < 7) row.push(""); 
                const clienteNome = (row[2] ? row[2].trim() : "");
                if(!clienteNome) continue;

                const normKey = normalizeClientKey(clienteNome);
                if (HEADER_WORDS.includes(normKey)) continue;
                if (!isAllowedClient(clienteNome)) continue;

                if(!globalAllClients.some(c => normalizeClientKey(c) === normKey)) {
                    globalAllClients.push(clienteNome);
                }

                const consumoNum = safeParseFloat(row[1]);
                const clientCip = cipMap[normKey] !== undefined ? cipMap[normKey] : 0;
                
                const custoKwhNum = consumoNum * TARIFA_KWH;
                const valorBruto = custoKwhNum + clientCip;
                
                const faturamentoCalculado = valorBruto * 0.80; 
                const custoProducaoKwh = consumoNum * CUSTO_KWH_USINA;
                const custoTotalUsina = custoProducaoKwh + clientCip;
                
                const baseLucroLiquido = faturamentoCalculado - custoTotalUsina;

                // APLICA A METADE (50%) PARA TODOS OS VALORES QUE VIEREM
                const lucroLiquido = baseLucroLiquido * 0.50;

                const mes = row[4] ? row[4].trim() : "Outro";
                const statusStr = (row[6] ? row[6].toLowerCase() : "");
                const isPaid = statusStr.includes('pago');

                if(mes && !HEADER_WORDS.includes(mes.toLowerCase()) && !monthsArray.includes(mes)) {
                    monthsArray.push(mes);
                }

                globalAllInvoices.push({
                    cliente: clienteNome,
                    normKey: normKey,
                    consumoNum: consumoNum,
                    consumo: consumoNum.toString(),
                    lucroLiquidoNum: lucroLiquido,
                    lucroStr: lucroLiquido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
                    mes: mes,
                    status: isPaid ? 'pago' : 'pendente'
                });
            }

            globalAllInvoices.reverse();

            monthsArray.sort((a, b) => {
                let idxA = NATIVE_MONTHS.findIndex(m => a.toLowerCase().includes(m));
                let idxB = NATIVE_MONTHS.findIndex(m => b.toLowerCase().includes(m));
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                return 0;
            });

            const monthSelect = document.getElementById('month-filter');
            monthSelect.innerHTML = '';
            
            monthsArray.forEach(m => {
                const capMonth = m.charAt(0).toUpperCase() + m.slice(1).toLowerCase();
                monthSelect.innerHTML += `<option value="${m}" class="bg-[#0b1022] text-white">${capMonth}</option>`;
            });
            monthSelect.innerHTML += `<option value="TODOS" class="bg-[#0b1022] text-white">Todos os Meses</option>`;

            const now = new Date();
            const currentMonthNamePt = NATIVE_MONTHS[now.getMonth()];
            
            let matchedCurrentMonth = monthsArray.find(m => m.toLowerCase().includes(currentMonthNamePt));
            
            if (matchedCurrentMonth) {
                monthSelect.value = matchedCurrentMonth;
            } else if (monthsArray.length > 0) {
                monthSelect.value = monthsArray[monthsArray.length - 1];
            }

            filterDataByMonth();
        }

        function filterDataByMonth() {
            const selectedMonth = document.getElementById('month-filter').value;
            currentFilteredCards = [];

            if (selectedMonth === 'TODOS') {
                document.getElementById('hero-month-title').innerText = 'LUCRO TOTAL ACUMULADO';
                document.getElementById('month-subtitle-display').innerText = 'Lucro Líquido Acumulado da Usina';
                globalAllInvoices.forEach(inv => {
                    currentFilteredCards.push({ hasData: true, ...inv });
                });
            } else {
                const capMonth = selectedMonth.charAt(0).toUpperCase() + selectedMonth.slice(1).toLowerCase();
                document.getElementById('hero-month-title').innerText = `LUCRO TOTAL DE ${selectedMonth.toUpperCase()}`;
                document.getElementById('month-subtitle-display').innerText = `Lucro Líquido da Usina em ${capMonth}`;
                
                globalAllClients.forEach(clientName => {
                    const normClientKey = normalizeClientKey(clientName);
                    const matchedInvoice = globalAllInvoices.find(
                        inv => inv.normKey === normClientKey && 
                               inv.mes.toLowerCase() === selectedMonth.toLowerCase()
                    );

                    if (matchedInvoice) {
                        currentFilteredCards.push({ hasData: true, ...matchedInvoice });
                    } else {
                        currentFilteredCards.push({
                            hasData: false,
                            cliente: clientName,
                            normKey: normClientKey,
                            consumo: '--',
                            lucroLiquidoNum: 0,
                            lucroStr: '--',
                            mes: selectedMonth,
                            status: 'sem_dados'
                        });
                    }
                });
            }

            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('cards-container');
            const searchQuery = (document.getElementById('search-client-input')?.value || '').trim().toLowerCase();
            container.innerHTML = '';

            let totalLucroMes = 0;
            currentFilteredCards.forEach(c => {
                if(c.hasData) totalLucroMes += c.lucroLiquidoNum;
            });

            // Formata apenas os dígitos sem repetir "R$" porque o "R$" já está estilizado ao lado
            const formattedValueOnly = totalLucroMes.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('total-revenue-display').innerText = formattedValueOnly;

            const visibleCards = currentFilteredCards
                .map((item, originalIndex) => ({ item, originalIndex }))
                .filter(({ item }) => !searchQuery || item.cliente.toLowerCase().includes(searchQuery));

            document.getElementById('cards-count-badge').innerText = visibleCards.length;

            if(visibleCards.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-10 text-center bg-white/[0.04] border border-white/10 rounded-3xl my-2">
                        <i class="fa-solid fa-folder-open text-2xl text-slate-500 mb-3"></i>
                        <p class="text-sm text-slate-300 font-medium">Nenhum registro encontrado para este período.</p>
                    </div>
                `;
                return;
            }

            let cardsHtml = '';

            visibleCards.forEach(({ item, originalIndex }, idx) => {
                const initialLetter = (item.cliente.trim()[0] || 'C').toUpperCase();
                const avatarStyle = AVATAR_COLORS[originalIndex % AVATAR_COLORS.length];

                let statusPillHtml = '';
                let subtextHtml = '';
                let profitValueHtml = '';

                if (item.hasData) {
                    const isPaid = item.status === 'pago';
                    if (isPaid) {
                        statusPillHtml = `
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/40">
                                <span class="w-3.5 h-3.5 rounded-full bg-emerald-400 text-slate-950 flex items-center justify-center text-[8px] font-black">
                                    <i class="fa-solid fa-check"></i>
                                </span>
                                Recebido
                            </span>
                        `;
                    } else {
                        statusPillHtml = `
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/40">
                                <i class="fa-regular fa-clock text-[10px] text-amber-400"></i>
                                Pendente
                            </span>
                        `;
                    }

                    subtextHtml = `
                        <i class="fa-regular fa-calendar text-sky-400 text-xs w-3.5 text-center"></i>
                        <span>Mês: <strong class="text-slate-100 font-semibold">${item.mes}</strong></span>
                    `;

                    profitValueHtml = `<div class="tabular-nums text-xl sm:text-2xl font-black text-solar-neon tracking-tight leading-tight">${item.lucroStr}</div>`;
                } else {
                    statusPillHtml = `
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-sky-500/15 text-sky-300 border border-sky-400/35">
                            <i class="fa-solid fa-minus text-[9px] text-sky-400"></i>
                            Sem Dados
                        </span>
                    `;

                    subtextHtml = `
                        <i class="fa-regular fa-calendar text-slate-400 text-xs w-3.5 text-center"></i>
                        <span>Mês: <strong class="text-slate-300 font-semibold">${item.mes}</strong></span>
                    `;

                    profitValueHtml = `<div class="tabular-nums text-xl font-black text-solar-neon/60 tracking-tight leading-tight">--</div>`;
                }

                cardsHtml += `
                    <div class="client-dark-card p-4 fade-in-up" style="animation-delay: ${idx * 0.03}s">
                        <div>
                            <!-- Topo: Avatar + Pílula de Status -->
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <div class="w-9 h-9 rounded-full ${avatarStyle} flex items-center justify-center font-extrabold text-sm flex-shrink-0">
                                    ${initialLetter}
                                </div>
                                ${statusPillHtml}
                            </div>

                            <!-- Nome do Cliente -->
                            <h3 class="text-lg font-extrabold text-white capitalize tracking-tight truncate mb-2" title="${item.cliente}">
                                ${item.cliente}
                            </h3>

                            <!-- Mês -->
                            <div class="space-y-1 text-xs text-slate-300 mb-3.5">
                                <div class="flex items-center gap-2">
                                    ${subtextHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Caixa Interna: Ícone Painel + Lucro Usina -->
                        <div class="inner-profit-panel flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-sky-500/15 border border-sky-400/30 flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid fa-solar-panel text-sky-400 text-base"></i>
                            </div>
                            <div class="min-w-0">
                                <span class="block text-[11px] font-medium text-slate-300 leading-tight">Lucro Usina</span>
                                ${profitValueHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = cardsHtml;
        }

        let scene, camera, renderer, controls;

        function initClean3DScene() {
            const container = document.getElementById('canvas-container');
            if(container.children.length > 0) return; 

            scene = new THREE.Scene();
            const aspect = container.clientWidth / container.clientHeight;
            
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 2.5, 12.0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.minDistance = 6;
            controls.maxDistance = 18;
            controls.target.set(0, 0, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.95); 
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.4); 
            dirLight.position.set(4, 12, 8); 
            scene.add(dirLight);

            const loader = new THREE.GLTFLoader();
            loader.load('./casa.glb', (gltf) => {
                const houseModel = gltf.scene;
                houseModel.position.set(0, -1.0, 0);
                houseModel.scale.set(0.75, 0.75, 0.75);
                scene.add(houseModel);
            }, undefined, (err) => {
                console.warn("Modelo 3D ./casa.glb não foi encontrado ou falhou ao carregar.", err);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                if(!container) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }
    </script>
